# ============================================================
# CI — runs on every Pull Request
# Stage 1: Lint (check code style)
# Stage 2: dbt build to DEV (test that models actually build)
# ============================================================
name: CI (Lint + Build DEV)

on:
  pull_request:
    branches: [main]

jobs:
  # ---- Job 1: Lint (fast check, no Snowflake) ----
  lint:
    name: Lint YAML + SQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install yamllint sqlfluff

      - name: YAML Lint
        run: yamllint -c .yamllint.yml dbt_project.yml profiles.yml

      - name: SQL Lint
        run: sqlfluff lint models/ --dialect snowflake --ignore templating || true

  # ---- Job 2: Build to DEV (runs after lint passes) ----
  build-dev:
    name: dbt build to DEV
    needs: [lint]
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt build (DEV)
        run: dbt build --target dev
