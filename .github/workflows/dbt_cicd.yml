# ============================================================
# CALLER — dbt_simple
# NO PASSWORDS — uses keypair (local) and OIDC (CI/CD)
#
#   PR to main      -> stage: ci  (lint + build CI schema via OIDC)
#   push/merge main -> stage: cd  (build PROD schema via OIDC)
# ============================================================
name: dbt CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ---- CI: on Pull Request ----
  ci:
    if: github.event_name == 'pull_request'
    uses: bhasinmanish123/dbt-actions/.github/workflows/dbt-reusable.yml@main
    with:
      stage: ci
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      # NO SNOWFLAKE_PASSWORD — OIDC token fetched by reusable workflow

  # ---- CD: on push/merge to main ----
  cd:
    if: github.event_name == 'push'
    uses: bhasinmanish123/dbt-actions/.github/workflows/dbt-reusable.yml@main
    with:
      stage: cd
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      # NO SNOWFLAKE_PASSWORD — OIDC token fetched by reusable workflow
