# ============================================================
# CALLER — dbt_simple
# Uses Snowflake WIF (OIDC) — no passwords, no user secret
# Only SNOWFLAKE_ACCOUNT needed as a secret
#
#   PR to main      -> stage: ci  (lint + build CI schema)
#   push/merge main -> stage: cd  (build PROD schema)
# ============================================================
name: dbt CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Required for OIDC token request
permissions:
  id-token: write
  contents: read

jobs:
  # ---- CI: on Pull Request ----
  ci:
    if: github.event_name == 'pull_request'
    uses: bhasinmanish123/dbt-actions/.github/workflows/dbt-reusable.yml@main
    with:
      stage: ci
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}

  # ---- CD: on push/merge to main ----
  cd:
    if: github.event_name == 'push'
    uses: bhasinmanish123/dbt-actions/.github/workflows/dbt-reusable.yml@main
    with:
      stage: cd
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
