# ============================================================
# profiles.yml — Snowflake connection (NO PASSWORDS)
#   dev  : keypair auth (local laptop)
#   ci   : OIDC oauth token (GitHub Actions)
#   prod : keypair auth
# ============================================================
dbt_simple:
  target: dev
  outputs:

    # ---- DEV: local laptop — KEYPAIR auth (no password) ----
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'admin') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '~/.snowflake/rsa_key.p8') }}"
      role: TRANSFORM
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: DEV
      threads: 4

    # ---- CI: GitHub Actions — OIDC OAUTH token (no password, no key) ----
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'admin') }}"
      authenticator: oauth
      token: "{{ env_var('SNOWFLAKE_OAUTH_TOKEN', '') }}"
      role: TRANSFORM
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: CI
      threads: 4

    # ---- PROD: KEYPAIR auth (no password) ----
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'admin') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '~/.snowflake/rsa_key.p8') }}"
      role: TRANSFORM
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: PROD
      threads: 4
