# ============================================================
# profiles.yml — Snowflake connection via OIDC only
# NO keypair, NO password anywhere
#   dev  : OIDC oauth token
#   ci   : OIDC oauth token
#   prod : OIDC oauth token
# ============================================================
dbt_simple:
  target: ci
  outputs:

    # ---- DEV: OIDC auth ----
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'admin') }}"
      authenticator: oauth
      token: "{{ env_var('SNOWFLAKE_OAUTH_TOKEN', '') }}"
      role: TRANSFORM
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: DEV
      threads: 4

    # ---- CI: OIDC auth (GitHub Actions PR) ----
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'admin') }}"
      authenticator: oauth
      token: "{{ env_var('SNOWFLAKE_OAUTH_TOKEN', '') }}"
      role: TRANSFORM
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: CI
      threads: 4

    # ---- PROD: OIDC auth (GitHub Actions merge) ----
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'admin') }}"
      authenticator: oauth
      token: "{{ env_var('SNOWFLAKE_OAUTH_TOKEN', '') }}"
      role: TRANSFORM
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: PROD
      threads: 4
