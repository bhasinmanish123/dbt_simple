# ============================================================
# profiles.yml — Snowflake WIF (OIDC)
# Flow: ci (PR validate) → dev (on merge) → prod (on merge)
# snowflake-actions@v3 sets SNOWFLAKE_TOKEN automatically
# ============================================================
dbt_simple:
  target: ci
  outputs:

    # ---- CI: PR validation (AIRBNB.CI) ----
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: GITHUB_ACTIONS_SERVICE_USER
      authenticator: workload_identity
      workload_identity_provider: oidc
      token: "{{ env_var('SNOWFLAKE_TOKEN', '') }}"
      role: DBT_CI_ROLE
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: CI
      threads: 4

    # ---- DEV: on merge to main (AIRBNB.DEV) ----
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: GITHUB_ACTIONS_SERVICE_USER
      authenticator: workload_identity
      workload_identity_provider: oidc
      token: "{{ env_var('SNOWFLAKE_TOKEN', '') }}"
      role: DBT_DEV_ROLE
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: DEV
      threads: 4

    # ---- PROD: on merge to main (AIRBNB.PROD) ----
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: GITHUB_ACTIONS_SERVICE_USER
      authenticator: workload_identity
      workload_identity_provider: oidc
      token: "{{ env_var('SNOWFLAKE_TOKEN', '') }}"
      role: DBT_PROD_ROLE
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: PROD
      threads: 4
