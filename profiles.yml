# ============================================================
# profiles.yml — Snowflake WIF (OIDC) via snowflake-cli-action
# The CLI action sets SNOWFLAKE_TOKEN + SNOWFLAKE_AUTHENTICATOR
# dbt picks up SNOWFLAKE_TOKEN via env_var
# NO passwords, NO keys
# ============================================================
dbt_simple:
  target: ci
  outputs:

    # ---- CI: GitHub Actions PR builds ----
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: DBT_CI_GITHUB
      authenticator: oauth
      token: "{{ env_var('SNOWFLAKE_TOKEN', '') }}"
      role: DBT_CI_ROLE
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: CI
      threads: 4

    # ---- PROD: GitHub Actions merge deploys ----
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: DBT_PROD_GITHUB
      authenticator: oauth
      token: "{{ env_var('SNOWFLAKE_TOKEN', '') }}"
      role: DBT_PROD_ROLE
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: PROD
      threads: 4
