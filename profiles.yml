# ============================================================
# profiles.yml — Snowflake connection via WIF (OIDC) only
# Uses dedicated service users per environment
# NO passwords, NO keys — Snowflake CLI handles auth
# ============================================================
dbt_simple:
  target: ci
  outputs:

    # ---- CI: GitHub Actions PR builds (WIF service user) ----
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: DBT_CI_GITHUB
      authenticator: oauth
      token: "{{ env_var('SNOWFLAKE_OAUTH_TOKEN', '') }}"
      role: DBT_CI_ROLE
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: CI
      threads: 4

    # ---- PROD: GitHub Actions merge deploys (WIF service user) ----
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: DBT_PROD_GITHUB
      authenticator: oauth
      token: "{{ env_var('SNOWFLAKE_OAUTH_TOKEN', '') }}"
      role: DBT_PROD_ROLE
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: PROD
      threads: 4
