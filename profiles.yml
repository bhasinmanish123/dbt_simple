# ============================================================
# profiles.yml — Snowflake WIF (OIDC)
# authenticator: workload_identity
# workload_identity_provider: oidc (required by dbt-snowflake)
# ============================================================
dbt_simple:
  target: ci
  outputs:

    # ---- CI: GitHub Actions PR builds ----
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: GITHUB_ACTIONS_SERVICE_USER
      authenticator: workload_identity
      workload_identity_provider: oidc
      role: DBT_CI_ROLE
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: CI
      threads: 4

    # ---- PROD: GitHub Actions merge deploys ----
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: GITHUB_ACTIONS_SERVICE_USER
      authenticator: workload_identity
      workload_identity_provider: oidc
      role: DBT_PROD_ROLE
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: PROD
      threads: 4
